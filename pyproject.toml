[project]
name = "memegen"
version = "0.1.0"
description = "Gerador de memes com IA sobre a curadoria do 9GAG"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pydantic>=2.0",
]

[project.scripts]
memegen = "memegen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
